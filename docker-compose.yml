# The only supported host workflow. The host needs Docker and nothing else.
#
# The network is `internal`, so no container here can reach anything outside this demo, and no
# port is published to the host. Verification containers run *inside* the network and talk to the
# applications the way any client would.
#
# Several identical instances of an application run side by side. Each seeds its own fresh state at
# startup, so every scenario reconciles an untouched 120-seat allocation instead of inheriting the
# previous one's leftovers. Same image, same code — only their state differs.
#
# The deliberately vulnerable application is behind the `vulnerable` profile AND requires
# ALLOW_VULNERABLE_DEMO=true. Both are required; neither alone starts it.

name: flowjack

networks:
  flowjack:
    driver: bridge
    internal: true

x-hardening: &hardening
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

x-healthcheck: &healthcheck
  test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
  interval: 3s
  timeout: 3s
  retries: 20
  start_period: 3s

x-secure-app: &secure-app
  <<: *hardening
  build: .
  image: flowjack:local
  networks: [flowjack]
  environment:
    # Deliberately short so the walkthrough observes a real expiry inside its time budget
    # instead of waiting out a venue-realistic window. See README.
    FLOWJACK_HOLD_TTL_SECONDS: "3"
  command:
    - uvicorn
    - flowjack.secure_app:app
    - --host
    - 0.0.0.0
    - --port
    - "8000"
  healthcheck: *healthcheck

# Started only with `--profile vulnerable` *and* ALLOW_VULNERABLE_DEMO=true. The entry point is a
# uvicorn factory, so the acknowledgement is checked when the server builds the application: the
# container exits non-zero without it.
x-vulnerable-app: &vulnerable-app
  <<: *hardening
  build: .
  image: flowjack:local
  profiles: [vulnerable]
  networks: [flowjack]
  environment:
    FLOWJACK_HOLD_TTL_SECONDS: "3"
    ALLOW_VULNERABLE_DEMO: "${ALLOW_VULNERABLE_DEMO:-}"
  command:
    - uvicorn
    - flowjack.vulnerable_app:create_vulnerable_app
    - --factory
    - --host
    - 0.0.0.0
    - --port
    - "8000"
  healthcheck: *healthcheck

services:
  # The secure application is the default. It is the only application the default path starts.
  secure-app: *secure-app
  secure-app-harness: *secure-app

  vulnerable-app: *vulnerable-app
  vulnerable-app-abandon: *vulnerable-app

  # One-shot verification of the secure side: linters, types, the test suite, the HTTP
  # walkthrough, and the automation harness.
  verify:
    <<: *hardening
    build: .
    image: flowjack:local
    networks: [flowjack]
    depends_on:
      secure-app:
        condition: service_healthy
      secure-app-harness:
        condition: service_healthy
    environment:
      FLOWJACK_BASE_URL: "http://secure-app:8000"
      FLOWJACK_HOLD_TTL_SECONDS: "3"
      RUFF_CACHE_DIR: /tmp/ruff
      MYPY_CACHE_DIR: /tmp/mypy
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        echo "== ruff =="
        ruff check .
        ruff format --check .
        echo "== mypy =="
        mypy src tests
        echo "== pytest =="
        pytest -p no:cacheprovider
        echo "== walkthrough (HTTP boundary) =="
        python -m flowjack.walkthrough
        echo "== harness: secure baseline =="
        python -m flowjack.harness \
          --base-url http://secure-app-harness:8000 \
          --scenario secure-baseline \
          --expect "flow limit held" \
          --transcript-path /tmp/flowjack-secure.txt
        echo "-- transcript artifact --"
        head -1 /tmp/flowjack-secure.txt
        echo "   ($(wc -l < /tmp/flowjack-secure.txt) lines)"

  # One-shot verification of the vulnerable side. Reaching this needs both opt-in actions.
  verify-vulnerable:
    <<: *hardening
    build: .
    image: flowjack:local
    profiles: [vulnerable]
    networks: [flowjack]
    depends_on:
      vulnerable-app:
        condition: service_healthy
      vulnerable-app-abandon:
        condition: service_healthy
    environment:
      ALLOW_VULNERABLE_DEMO: "${ALLOW_VULNERABLE_DEMO:-}"
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        echo "== harness: no anti-automation (FR-012) =="
        python -m flowjack.harness \
          --base-url http://vulnerable-app:8000 \
          --scenario no-anti-automation \
          --expect "flow limit absent"
        echo "== harness: abandoned holds (FR-013) =="
        python -m flowjack.harness \
          --base-url http://vulnerable-app-abandon:8000 \
          --scenario abandoned-holds \
          --abandon-wait-seconds 4 \
          --expect "flow limit absent"
